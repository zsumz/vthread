[package]
name = "vthread-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[features]
allocation-probe = []
lifecycle-profiling = ["vthread/lifecycle-profiling"]
scheduler-profiling = ["vthread/scheduler-profiling"]
handoff-profiling = ["scheduler-profiling", "vthread/handoff-profiling"]

[dependencies]
vthread = { path = "../crates/vthread" }

[profile.release]
codegen-units = 1
lto = "thin"

[workspace]
