schema = 1
default = "check"

[execution]
jobs = 2
default_timeout = "15m"
repository_state = "preserve"

[tasks.policy]
description = "Enforce the zsumz source-layout and unsafe-boundary policy."
run = ["python3", "scripts/guardrail-policy.py"]
tools = ["python3"]

[tasks.format]
description = "Validate Rust formatting."
run = ["cargo", "fmt", "--all", "--", "--check"]
tools = ["cargo"]
needs = ["policy"]

[tasks.clippy]
description = "Reject workspace warnings and suspicious code."
run = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
tools = ["cargo"]
needs = ["format"]

[tasks.panic-contract]
description = "Reject panic-abort builds at both crate boundaries."
run = ["python3", "scripts/panic_contract_test.py"]
tools = ["python3", "cargo"]
needs = ["clippy"]

[tasks.test]
description = "Run native-engine workspace tests with every diagnostic feature."
run = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]
tools = ["cargo"]
needs = ["panic-contract"]

[tasks.test-native]
description = "Run the default native-engine workspace tests in debug."
run = ["cargo", "test", "--locked", "--workspace", "--all-targets"]
tools = ["cargo"]
needs = ["test", "qualification-policy-test"]

[tasks.test-native-release]
description = "Run the optimized default native-engine workspace tests."
run = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--release"]
tools = ["cargo"]
needs = ["test-native"]

[tasks.perf-cancellation-history]
description = "Check cancellation-history timing separately on an otherwise idle host."
run = ["cargo", "test", "--locked", "-p", "vthread", "--release", "cancellation::cancellation_history_test::sequential_dynamic_history_retains_its_performance_guard", "--", "--ignored", "--exact", "--nocapture"]
tools = ["cargo"]

[tasks.qualification-policy-test]
description = "Prove native qualification cannot silently lose a required gate."
run = ["python3", "scripts/guardrail_policy_test.py"]
tools = ["python3"]
needs = ["policy"]

[tasks.docs]
description = "Build public API documentation without dependencies."
run = ["cargo", "doc", "--locked", "--workspace", "--all-features", "--no-deps"]
tools = ["cargo"]
needs = ["doctest"]

[tasks.doctest]
description = "Run the API example and prove the documented Send boundaries."
run = ["cargo", "test", "--locked", "--workspace", "--all-features", "--doc"]
tools = ["cargo"]
needs = ["test", "test-native-release"]

[tasks.zrail]
description = "Enforce the zsumz architecture lock."
run = ["zrail", "check"]
tools = ["zrail"]
needs = ["docs"]

[tasks.check]
description = "Check the complete vthread source checkout."
needs = ["zrail", "application-smoke", "test-native-release", "benchmark-test-features"]

[tasks.benchmark-format]
description = "Validate formatting in the standalone scheduler harness."
run = ["cargo", "fmt", "--manifest-path", "benchmarks/Cargo.toml", "--", "--check"]
tools = ["cargo"]
needs = ["application-smoke", "zrail"]

[tasks.benchmark-clippy]
description = "Reject warnings in every scheduler-harness feature."
run = ["cargo", "clippy", "--locked", "--manifest-path", "benchmarks/Cargo.toml", "--all-targets", "--all-features", "--", "-D", "warnings"]
tools = ["cargo"]
needs = ["benchmark-format"]

[tasks.benchmark-test]
description = "Test the standalone scheduler harness without instrumentation."
run = ["cargo", "test", "--locked", "--manifest-path", "benchmarks/Cargo.toml", "--all-targets"]
tools = ["cargo"]
needs = ["benchmark-clippy"]

[tasks.benchmark-test-features]
description = "Test the standalone scheduler harness with every diagnostic feature."
run = ["cargo", "test", "--locked", "--manifest-path", "benchmarks/Cargo.toml", "--all-targets", "--all-features"]
tools = ["cargo"]
needs = ["benchmark-test"]

[tasks.application-evidence-test]
description = "Reject corrupt payloads, hidden offered arrivals, unbounded client admission and incomplete recovery evidence."
run = ["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "application_*test.py"]
tools = ["python3"]
needs = ["policy"]

[tasks.application-smoke]
description = "Exercise bounded public-API TCP load, overload, deadline recovery and loaded shutdown."
run = ["python3", "scripts/run-application.py", "--carriers", "1", "--concurrency", "1", "16", "--rounds", "8", "--fault-rounds", "1", "--offered-rates", "2000", "--offered-count", "64"]
tools = ["python3", "cargo"]
needs = ["application-evidence-test", "test", "test-native-release"]
