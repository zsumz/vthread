[package]
name = "vthread"
description = "Bounded carrier-affine virtual threads for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/vthread"
publish = ["crates-io"]
keywords = ["virtual-thread", "runtime", "coroutine", "concurrency"]
categories = ["asynchronous", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
lifecycle-profiling = []
runtime-evidence = ["vthread-stack/runtime-evidence"]
qualification = ["runtime-evidence", "lifecycle-profiling"]

[dependencies]
vthread-stack.workspace = true
zio.workspace = true
socket2.workspace = true
libc.workspace = true
crossbeam-queue.workspace = true

[lints]
workspace = true
