name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86-64
          - runner: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: /tmp/vthread-check-build
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
      - name: Install repository tools
        run: |
          scripts/install-guardrails.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path reference/Cargo.toml
      - name: Check
        env:
          CARGO_NET_OFFLINE: 'true'
        run: zcheck run check --format github --logs-dir .zcheck/logs --receipt .zcheck/receipt.json
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.target }}
          path: .zcheck/
          include-hidden-files: true
          if-no-files-found: warn
